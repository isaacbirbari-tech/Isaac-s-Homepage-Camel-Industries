<!DOCTYPE html>
<html>
<head>
    <title>Google Maps</title>
    <style>
        body {
            background: 
                radial-gradient(1px 1px at 25% 35%, white 100%, transparent 0),
                radial-gradient(1px 1px at 50% 10%, white 100%, transparent 0),
                radial-gradient(1px 1px at 75% 50%, white 100%, transparent 0),
                radial-gradient(2px 2px at 15% 70%, rgba(255, 255, 255, 0.8) 100%, transparent 0),
                radial-gradient(2px 2px at 85% 20%, rgba(255, 255, 255, 0.7) 100%, transparent 0),
                radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            background-size: 500px 500px, 400px 400px, 300px 300px, 600px 600px, 700px 700px, 100% 100%;
            background-attachment: fixed;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 40px;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        iframe {
            height: 700px;
            width: 1200px;
            max-width: 95%;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        a {
            color: #ff0055;
            text-decoration: none;
        }

        a h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="nav-links">
        <a href="index.html"><h1>Home</h1></a>
        <a href="arcade.file"><h1>Back</h1></a>
    </div>

    <iframe 
        src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d13360.077945500874!2d-121.8129364!3d36.2694284!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808d8ffb4da45855%3A0x16a5d7c7f1b7e362!2sBig+Sur%2C+CA+93920!5e1!3m2!1sen!2sus!4v1500934629666" 
        allowfullscreen>
    </iframe>

</body>
</html>
